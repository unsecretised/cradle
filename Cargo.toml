[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains (`if let .. && let ..`) need 1.88.
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
cradle-backends = { path = "crates/cradle-backends" }
cradle-config = { path = "crates/cradle-config" }
cradle-core = { path = "crates/cradle-core" }
cradle-mcp = { path = "crates/cradle-mcp" }
cradle-provider-spec = { path = "crates/cradle-provider-spec" }
cradle-tools = { path = "crates/cradle-tools" }

# External crates (see .agents/deps.md)
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
globset = "0.4.21"
hex = "0.4.3"
ignore = "0.4.34"
keyring = "4.2.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shlex = "2.0.1"
similar = "3.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.2.1"
unicode-width = "0.2"
url = "2.5.8"
